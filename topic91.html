<!DOCTYPE html>
<html>
<head>
    <title>HTML Forms</title>
</head>
<body>

    <h1>HTML Registration Form</h1>

    <form action="/action_page.php">

        <label for="fname">First Name:</label><br>
        <input type="text" id="fname" name="fname"><br><br>

        <label for="lname">Last Name:</label><br>
        <input type="text" id="lname" name="lname"><br><br>

        <h3>Select Your Favourite Language:</h3>

        <input type="radio" id="html" name="language" value="HTML">
        <label for="html">HTML</label><br>

        <input type="radio" id="css" name="language" value="CSS">
        <label for="css">CSS</label><br><br>

        <h3>Select Your Vehicles:</h3>

        <input type="checkbox" id="bike" name="vehicle1" value="Bike">
        <label for="bike">Bike</label><br>

        <input type="checkbox" id="car" name="vehicle2" value="Car">
        <label for="car">Car</label><br>

        <input type="checkbox" id="boat" name="vehicle3" value="Boat">
        <label for="boat">Boat</label><br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
