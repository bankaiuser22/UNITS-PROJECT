<!DOCTYPE html>
<html>
<head>
    <title>HTML Images</title>
</head>
<body>

    <h1>HTML Images</h1>

    <h2>1. Simple Image</h2>
    <img src="img_girl.jpg" alt="Girl with a jacket">

    <h2>2. Image with Width and Height</h2>
    <img src="img_girl.jpg"
         alt="Girl with a jacket"
         width="300"
         height="200">

    <h2>3. Image using Style Attribute</h2>
    <img src="img_girl.jpg"
         alt="Girl with a jacket"
         style="width:300px;height:200px;">

    <h2>4. Image as a Link</h2>
    <a href="default.asp">
        <img src="smiley.gif"
             alt="HTML tutorial"
             style="width:42px;height:42px;">
    </a>

</body>
</html>
