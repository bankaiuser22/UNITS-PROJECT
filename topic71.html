<!DOCTYPE html>
<html>
<head>
    <title>HTML Tables</title>
</head>

<body>

    <h1>HTML Tables</h1>

    <h2>1. Simple HTML Table</h2>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>

        <tr>
            <td>Pankaj</td>
            <td>20</td>
            <td>Vadodara</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>21</td>
            <td>Surat</td>
        </tr>
    </table>


    <h2>2. Table with Caption</h2>

    <table border="1">
        <caption>Student Details</caption>

        <tr>
            <th>Name</th>
            <th>Enrollment</th>
        </tr>

        <tr>
            <td>Pankaj</td>
            <td>101</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>102</td>
        </tr>
    </table>


    <h2>3. Table with Colspan</h2>

    <table border="1">
        <tr>
            <th colspan="2">Student Information</th>
        </tr>

        <tr>
            <td>Name</td>
            <td>Pankaj</td>
        </tr>
    </table>


    <h2>4. Table with Rowspan</h2>

    <table border="1">
        <tr>
            <th>Name</th>
            <td>Pankaj</td>
        </tr>

        <tr>
            <th rowspan="2">Marks</th>
            <td>80</td>
        </tr>

        <tr>
            <td>90</td>
        </tr>
    </table>

</body>
</html>
